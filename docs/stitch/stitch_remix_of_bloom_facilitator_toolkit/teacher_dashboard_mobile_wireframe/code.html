<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Bloom - Teacher Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Noto+Serif:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#884d5e",
                        "surface-container-low": "#fdf1f2",
                        "outline-variant": "#d5c2c6",
                        "surface-tint": "#864e60",
                        "on-tertiary-fixed-variant": "#2a4f2b",
                        "secondary-container": "#fdb2c5",
                        "outline": "#837377",
                        "secondary-fixed-dim": "#fdb2c5",
                        "tertiary": "#052b0b",
                        "primary": "#411525",
                        "inverse-on-surface": "#faeeef",
                        "on-primary-container": "#d491a5",
                        "primary-container": "#5b2a3b",
                        "on-tertiary-container": "#85ad82",
                        "primary-fixed-dim": "#fab3c7",
                        "surface-container": "#f7ebec",
                        "on-surface": "#201a1b",
                        "on-primary-fixed-variant": "#6a3748",
                        "on-secondary-fixed": "#370b1b",
                        "inverse-surface": "#352f30",
                        "surface-container-highest": "#ebe0e1",
                        "tertiary-fixed-dim": "#a7d1a3",
                        "on-background": "#201a1b",
                        "on-tertiary-fixed": "#002105",
                        "on-surface-variant": "#514347",
                        "on-secondary-container": "#7a4152",
                        "tertiary-container": "#1d411f",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#360c1d",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-variant": "#ebe0e1",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#6c3646",
                        "background": "#fff8f8",
                        "inverse-primary": "#fab3c7",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#c3eebd",
                        "surface-dim": "#e3d7d9",
                        "on-error": "#ffffff",
                        "surface": "#fff8f8",
                        "primary-fixed": "#ffd9e2",
                        "surface-bright": "#fff8f8",
                        "surface-container-high": "#f1e5e7",
                        "secondary-fixed": "#ffd9e1",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "sm": "8px",
                        "xs": "4px",
                        "unit": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "gutter": "12px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "display-lg": ["Noto Serif"],
                        "body-md": ["Be Vietnam Pro"],
                        "display-lg-mobile": ["Noto Serif"],
                        "headline-md": ["Noto Serif"],
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-sm": ["Noto Serif"],
                        "label-sm": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Utility for Material Symbols setup per instructions */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
        
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-container-low w-full sticky top-0 z-50 shadow-sm shadow-primary/5 flex justify-between items-center px-container-margin py-md w-full max-w-7xl mx-auto">
<div class="flex items-center gap-sm">
<h1 class="font-display-lg-mobile md:font-display-lg text-primary dark:text-inverse-primary tracking-tight">Bloom</h1>
</div>
<div class="flex items-center gap-md">
<button class="text-primary dark:text-inverse-primary hover:text-secondary transition-colors active:scale-95 duration-150 relative">
<span aria-label="Sync offline data" class="material-symbols-outlined">sync</span>
<!-- Subtle indicator dot for sync status -->
<span class="absolute top-0 right-0 w-2 h-2 bg-secondary rounded-full border border-surface"></span>
</button>
<button class="text-primary dark:text-inverse-primary hover:text-secondary transition-colors active:scale-95 duration-150">
<span aria-label="Language selection" class="material-symbols-outlined">language</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-7xl mx-auto px-container-margin py-lg flex flex-col gap-lg pb-32">
<!-- Welcome Header Section -->
<section class="flex flex-col gap-xs mb-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Hi, Teacher Namuli 👋</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">cloud_done</span> 
                All data synced
            </p>
</section>
<!-- Active Module Bento Card (Hero) -->
<section class="bg-[#FBF8F1] rounded-xl p-md border border-outline-variant/30 relative overflow-hidden shadow-[0_4px_16px_rgba(91,42,59,0.04)]">
<!-- Decorative subtle shape in background -->
<div class="absolute -right-10 -top-10 w-32 h-32 bg-secondary-container/20 rounded-full blur-2xl pointer-events-none"></div>
<div class="relative z-10 flex flex-col gap-md">
<div class="flex justify-between items-start">
<div>
<span class="inline-block bg-primary-container text-on-primary-container font-label-sm text-label-sm px-2 py-1 rounded-md mb-2">Active Module</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Understanding Your Cycle</h3>
</div>
<div class="bg-surface-container rounded-full p-2 text-primary">
<span class="material-symbols-outlined">menu_book</span>
</div>
</div>
<!-- Progress Tracker -->
<div class="flex flex-col gap-sm mt-2">
<div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant">
<span>Step 2 of 5</span>
<span>40% Complete</span>
</div>
<!-- Segmented Progress Bar -->
<div class="flex gap-1 w-full h-2">
<div class="flex-1 bg-primary rounded-l-full"></div>
<div class="flex-1 bg-primary rounded-none"></div>
<div class="flex-1 bg-surface-container-high rounded-none relative">
<!-- Blinking indicator for current step -->
<div class="absolute -top-1 left-1/2 -translate-x-1/2 w-4 h-4 bg-secondary/20 rounded-full animate-ping"></div>
<div class="absolute -top-1 left-1/2 -translate-x-1/2 w-4 h-4 border-2 border-secondary bg-surface rounded-full"></div>
</div>
<div class="flex-1 bg-surface-container-high rounded-none"></div>
<div class="flex-1 bg-surface-container-high rounded-r-full"></div>
</div>
</div>
<button class="mt-2 w-full bg-primary text-on-primary font-label-md text-label-md h-[48px] rounded-lg flex items-center justify-center gap-2 active:bg-primary/90 transition-colors">
<span class="material-symbols-outlined text-[20px]">play_arrow</span>
                    Resume Session
                </button>
</div>
</section>
<!-- Quick Actions Grid -->
<section class="grid grid-cols-2 gap-md mt-sm">
<!-- Action 1 -->
<button class="bg-[#FBF8F1] rounded-xl p-md border border-outline-variant/30 flex flex-col items-start gap-sm active:bg-surface-container-low transition-colors shadow-[0_2px_8px_rgba(91,42,59,0.03)] h-[120px] justify-between">
<div class="bg-primary-container/10 p-2 rounded-lg text-primary">
<span class="material-symbols-outlined">play_circle</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-left leading-tight">Start<br/>Session</span>
</button>
<!-- Action 2 -->
<button class="bg-[#FBF8F1] rounded-xl p-md border border-outline-variant/30 flex flex-col items-start gap-sm active:bg-surface-container-low transition-colors shadow-[0_2px_8px_rgba(91,42,59,0.03)] h-[120px] justify-between">
<div class="bg-secondary-container/30 p-2 rounded-lg text-secondary">
<span class="material-symbols-outlined">smart_toy</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-left leading-tight">Ask AI<br/>Co-Pilot</span>
</button>
<!-- Action 3 -->
<button class="bg-[#FBF8F1] rounded-xl p-md border border-outline-variant/30 flex flex-col items-start gap-sm active:bg-surface-container-low transition-colors shadow-[0_2px_8px_rgba(91,42,59,0.03)] h-[120px] justify-between">
<div class="bg-surface-container p-2 rounded-lg text-on-surface-variant">
<span class="material-symbols-outlined">how_to_reg</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-left leading-tight">Refer to<br/>Mentor</span>
</button>
<!-- Action 4 -->
<button class="bg-[#FBF8F1] rounded-xl p-md border border-outline-variant/30 flex flex-col items-start gap-sm active:bg-surface-container-low transition-colors shadow-[0_2px_8px_rgba(91,42,59,0.03)] h-[120px] justify-between">
<div class="bg-error-container/50 p-2 rounded-lg text-error">
<span class="material-symbols-outlined">report_problem</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-left leading-tight">Report<br/>Concern</span>
</button>
</section>
<!-- Spacer to ensure bottom content isn't hidden by nav -->
<div class="h-10"></div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container dark:bg-surface-container-highest fixed bottom-0 w-full z-50 md:hidden shadow-[0_-4px_12px_rgba(91,42,59,0.08)] flex justify-around items-center h-14 pb-safe px-4 transition-all duration-200 ease-in-out">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 active:bg-surface-variant group" href="#">
<span class="material-symbols-fill group-active:scale-95 transition-transform">home</span>
<span class="font-label-sm text-label-sm mt-0.5">Home</span>
</a>
<!-- Modules -->
<a class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant rounded-lg px-3 py-1 group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform">menu_book</span>
<span class="font-label-sm text-label-sm mt-0.5">Modules</span>
</a>
<!-- AI Assist -->
<a class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant rounded-lg px-3 py-1 group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform">smart_toy</span>
<span class="font-label-sm text-label-sm mt-0.5">AI Assist</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant rounded-lg px-3 py-1 group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform">settings</span>
<span class="font-label-sm text-label-sm mt-0.5">Settings</span>
</a>
</nav>
</body></html>
