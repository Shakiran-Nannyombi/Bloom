<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Bloom - Role / Mode Selector</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#884d5e",
                        "surface-container-low": "#fdf1f2",
                        "outline-variant": "#d5c2c6",
                        "surface-tint": "#864e60",
                        "on-tertiary-fixed-variant": "#2a4f2b",
                        "secondary-container": "#fdb2c5",
                        "outline": "#837377",
                        "secondary-fixed-dim": "#fdb2c5",
                        "tertiary": "#052b0b",
                        "primary": "#411525",
                        "inverse-on-surface": "#faeeef",
                        "on-primary-container": "#d491a5",
                        "primary-container": "#5b2a3b",
                        "on-tertiary-container": "#85ad82",
                        "primary-fixed-dim": "#fab3c7",
                        "surface-container": "#f7ebec",
                        "on-surface": "#201a1b",
                        "on-primary-fixed-variant": "#6a3748",
                        "on-secondary-fixed": "#370b1b",
                        "inverse-surface": "#352f30",
                        "surface-container-highest": "#ebe0e1",
                        "tertiary-fixed-dim": "#a7d1a3",
                        "on-background": "#201a1b",
                        "on-tertiary-fixed": "#002105",
                        "on-surface-variant": "#514347",
                        "on-secondary-container": "#7a4152",
                        "tertiary-container": "#1d411f",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#360c1d",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-variant": "#ebe0e1",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#6c3646",
                        "background": "#fff8f8",
                        "inverse-primary": "#fab3c7",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#c3eebd",
                        "surface-dim": "#e3d7d9",
                        "on-error": "#ffffff",
                        "surface": "#fff8f8",
                        "primary-fixed": "#ffd9e2",
                        "surface-bright": "#fff8f8",
                        "surface-container-high": "#f1e5e7",
                        "secondary-fixed": "#ffd9e1",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "sm": "8px",
                        "xs": "4px",
                        "unit": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "gutter": "12px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "display-lg": ["Noto Serif"],
                        "body-md": ["Be Vietnam Pro"],
                        "display-lg-mobile": ["Noto Serif"],
                        "headline-md": ["Noto Serif"],
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-sm": ["Noto Serif"],
                        "label-sm": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            /* iOS Safe Area padding for bottom indicator */
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Header (Suppressed main nav shell, custom layout for selector) -->
<header class="w-full px-container-margin py-lg flex flex-col items-center justify-center pt-xl">
<h1 class="font-display-lg-mobile md:font-display-lg text-primary dark:text-inverse-primary text-center">Bloom</h1>
<p class="font-body-md text-on-surface-variant text-center mt-sm">Toolkit for Trusted Adults</p>
<div class="mt-lg flex items-center bg-surface-container-high rounded-full p-xs">
<button class="px-md py-sm bg-primary text-on-primary rounded-full font-label-md text-label-md shadow-sm transition-all duration-200">English</button>
<button class="px-md py-sm text-on-surface-variant rounded-full font-label-md text-label-md hover:bg-surface-variant transition-all duration-200">Luganda</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-margin py-md flex flex-col gap-lg max-w-md mx-auto w-full">
<!-- Teacher Mode Card -->
<button class="group w-full text-left bg-surface rounded-[24px] p-lg border border-transparent hover:border-secondary transition-all duration-300 shadow-[0_4px_24px_rgba(65,21,37,0.04)] relative overflow-hidden">
<!-- Ambient gradient background for depth -->
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-low opacity-50"></div>
<div class="relative z-10 flex flex-col gap-md">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 24px;">school</span>
</div>
<h2 class="font-headline-md text-headline-md text-primary">Teacher Mode</h2>
</div>
<ul class="flex flex-col gap-sm mt-sm">
<li class="flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-[2px]" style="font-size: 18px;">check_circle</span>
<span class="font-body-md text-on-surface-variant">Classroom lesson plans &amp; activities</span>
</li>
<li class="flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-[2px]" style="font-size: 18px;">check_circle</span>
<span class="font-body-md text-on-surface-variant">AI Co-pilot for tough questions</span>
</li>
<li class="flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-[2px]" style="font-size: 18px;">check_circle</span>
<span class="font-body-md text-on-surface-variant">Student referral workflows</span>
</li>
</ul>
<div class="mt-md flex justify-end w-full">
<div class="px-md py-sm rounded-full bg-surface-container-high text-primary font-label-md text-label-md group-hover:bg-primary group-hover:text-on-primary transition-colors flex items-center gap-xs">
                        Enter Mode <span class="material-symbols-outlined" style="font-size: 16px;">arrow_forward</span>
</div>
</div>
</div>
</button>
<!-- Parent Mode Card -->
<button class="group w-full text-left bg-surface rounded-[24px] p-lg border border-transparent hover:border-secondary transition-all duration-300 shadow-[0_4px_24px_rgba(65,21,37,0.04)] relative overflow-hidden">
<!-- Ambient gradient background for depth -->
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-low opacity-50"></div>
<div class="relative z-10 flex flex-col gap-md">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 24px;">family_restroom</span>
</div>
<h2 class="font-headline-md text-headline-md text-primary">Parent Mode</h2>
</div>
<ul class="flex flex-col gap-sm mt-sm">
<li class="flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-[2px]" style="font-size: 18px;">check_circle</span>
<span class="font-body-md text-on-surface-variant">"Learn Before You Talk" modules</span>
</li>
<li class="flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-[2px]" style="font-size: 18px;">check_circle</span>
<span class="font-body-md text-on-surface-variant">Age-appropriate conversation starters</span>
</li>
<li class="flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-[2px]" style="font-size: 18px;">check_circle</span>
<span class="font-body-md text-on-surface-variant">AI guide for everyday parenting scenarios</span>
</li>
</ul>
<div class="mt-md flex justify-end w-full">
<div class="px-md py-sm rounded-full bg-surface-container-high text-primary font-label-md text-label-md group-hover:bg-primary group-hover:text-on-primary transition-colors flex items-center gap-xs">
                        Enter Mode <span class="material-symbols-outlined" style="font-size: 16px;">arrow_forward</span>
</div>
</div>
</div>
</button>
</main>
<!-- Footer -->
<footer class="bg-surface-container-highest dark:bg-surface-dim w-full py-sm flex justify-between items-center px-container-margin mt-auto flat no shadows opacity-90 pb-[calc(env(safe-area-inset-bottom)+16px)] pt-md">
<span class="font-label-sm text-label-sm text-on-surface-variant dark:text-surface-variant">© 2024 Bloom Uganda</span>
<div class="flex items-center gap-md">
<div class="flex items-center gap-xs bg-tertiary-container/10 px-2 py-1 rounded text-tertiary">
<span class="material-symbols-outlined" style="font-size: 14px;">cloud_done</span>
<span class="font-label-sm text-label-sm">Offline Cache Ready</span>
</div>
</div>
</footer>
</body></html>
