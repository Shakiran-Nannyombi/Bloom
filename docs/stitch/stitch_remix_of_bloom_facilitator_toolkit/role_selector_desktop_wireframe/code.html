<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bloom - Role Selector</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Noto+Serif:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#884d5e",
                        "surface-container-low": "#fdf1f2",
                        "outline-variant": "#d5c2c6",
                        "surface-tint": "#864e60",
                        "on-tertiary-fixed-variant": "#2a4f2b",
                        "secondary-container": "#fdb2c5",
                        "outline": "#837377",
                        "secondary-fixed-dim": "#fdb2c5",
                        "tertiary": "#052b0b",
                        "primary": "#411525",
                        "inverse-on-surface": "#faeeef",
                        "on-primary-container": "#d491a5",
                        "primary-container": "#5b2a3b",
                        "on-tertiary-container": "#85ad82",
                        "primary-fixed-dim": "#fab3c7",
                        "surface-container": "#f7ebec",
                        "on-surface": "#201a1b",
                        "on-primary-fixed-variant": "#6a3748",
                        "on-secondary-fixed": "#370b1b",
                        "inverse-surface": "#352f30",
                        "surface-container-highest": "#ebe0e1",
                        "tertiary-fixed-dim": "#a7d1a3",
                        "on-background": "#201a1b",
                        "on-tertiary-fixed": "#002105",
                        "on-surface-variant": "#514347",
                        "on-secondary-container": "#7a4152",
                        "tertiary-container": "#1d411f",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#360c1d",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-variant": "#ebe0e1",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#6c3646",
                        "background": "#fff8f8",
                        "inverse-primary": "#fab3c7",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#c3eebd",
                        "surface-dim": "#e3d7d9",
                        "on-error": "#ffffff",
                        "surface": "#fff8f8",
                        "primary-fixed": "#ffd9e2",
                        "surface-bright": "#fff8f8",
                        "surface-container-high": "#f1e5e7",
                        "secondary-fixed": "#ffd9e1",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "sm": "8px",
                        "xs": "4px",
                        "unit": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "gutter": "12px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "display-lg": ["Noto Serif"],
                        "body-md": ["Be Vietnam Pro"],
                        "display-lg-mobile": ["Noto Serif"],
                        "headline-md": ["Noto Serif"],
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-sm": ["Noto Serif"],
                        "label-sm": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col antialiased">
<!-- Main Content Area - Split Screen -->
<main class="flex-grow flex flex-col md:flex-row w-full h-full">
<!-- Left Side: Visual Banner (Desktop Only) -->
<div class="hidden md:block w-1/2 h-full bg-surface-container-high relative overflow-hidden rounded-r-3xl">
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="A warm, editorial photograph of a teacher and student in a rural Ugandan classroom setting, sunlight streaming through a window. The overall tone is hopeful, professional, and grounded, using earthy tones and natural lighting. The mood conveys trust and educational growth." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAYmHW-5G05vBOkIzdlnb6UVZu1uTWqOOMjG7bjBTNmR7-swmI6kL3T1j6yOQWddApFFvs3DEIJQsn5vO9KVU-SIPeRV_GQf84qxt6C7ibdhPlQf1UHzrfwevEEVeO_e7jVUFWoT8uRGSAmVzXgbVtrq1TgHtbzrKQHNMy599nBJYiac7uT7BGPK2d9UvmoNDknzapla4UcNPxAp-AfgPS6u_uHjUEgCMBjSRQRR_gjAGN6KO8QX5PR')"></div>
<!-- Overlay for legibility if needed later -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/40 to-transparent"></div>
</div>
<!-- Right Side: Interaction Area -->
<div class="w-full md:w-1/2 flex flex-col h-full bg-surface px-container-margin md:px-xl py-lg md:py-xl">
<!-- Top App Bar equivalent for onboarding -->
<header class="flex justify-between items-center w-full pb-md">
<h1 class="font-display-lg text-primary">Bloom</h1>
<div class="flex items-center gap-sm">
<button aria-label="language" class="text-on-surface-variant hover:text-secondary transition-colors">
<span class="material-symbols-outlined">language</span>
</button>
<button aria-label="sync" class="text-on-surface-variant hover:text-secondary transition-colors">
<span class="material-symbols-outlined">sync</span>
</button>
</div>
</header>
<!-- Content Area -->
<div class="flex-grow flex flex-col justify-center max-w-lg mx-auto w-full gap-xl">
<div class="text-center md:text-left space-y-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome to Bloom</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please select your primary role to customize your experience.</p>
</div>
<!-- Role Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Teacher Card -->
<button class="group relative flex flex-col items-center justify-center p-xl bg-surface-container-low rounded-2xl border border-transparent hover:border-secondary hover:bg-surface-container transition-all duration-200 active:scale-95 shadow-sm shadow-primary/5">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-md group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-colors">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Teacher</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">Access toolkit, lesson plans, and classroom management.</p>
<!-- Focus indicator -->
<div class="absolute inset-x-4 bottom-0 h-[2px] bg-primary scale-x-0 group-focus:scale-x-100 transition-transform origin-left"></div>
</button>
<!-- Parent/Caregiver Card -->
<button class="group relative flex flex-col items-center justify-center p-xl bg-surface-container-low rounded-2xl border border-transparent hover:border-secondary hover:bg-surface-container transition-all duration-200 active:scale-95 shadow-sm shadow-primary/5">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-md group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-colors">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">family_restroom</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Parent</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">Track progress, resources, and community updates.</p>
<!-- Focus indicator -->
<div class="absolute inset-x-4 bottom-0 h-[2px] bg-primary scale-x-0 group-focus:scale-x-100 transition-transform origin-left"></div>
</button>
</div>
</div>
<!-- Footer Section -->
<footer class="w-full py-sm bg-surface-container-highest dark:bg-surface-dim mt-auto rounded-lg px-md flex flex-col sm:flex-row justify-between items-center gap-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant dark:text-surface-variant">© 2024 Bloom Uganda</span>
<nav class="flex gap-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:underline opacity-90" href="#">Offline Status: Syncing...</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:underline opacity-90" href="#">Help Center</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:underline opacity-90" href="#">Privacy</a>
</nav>
</footer>
</div>
</main>
</body></html>
